[project]
name = "ha-bin-day"
version = "0.1.6"
description = "Bin Day: Home Assistant integration for waste collection dates"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.375",
    "pytest-asyncio",
    "home-assistant-frontend==20260930.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Any other warning fails the run. HA's own http component triggers aiohttp's
# NotAppKeyWarning; tests/conftest.py also ignores it for "-W error".
filterwarnings = [
    "error",
    "ignore::aiohttp.web_exceptions.NotAppKeyWarning",
]
